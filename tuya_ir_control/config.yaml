name: Tuya IR Control
version: "0.4.0"
slug: tuya_ir_control
description: Interface moderna para controles IR Tuya, catálogo, assistente de ar-condicionado e controles personalizados com aprendizado.
url: https://github.com/SEU_USUARIO/ha-tuya-ir-control
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: Tuya IR Control
panel_admin: true
stage: stable
watchdog: http://[HOST]:[PORT:8099]/health
services:
  - mqtt:want
options:
  mqtt_enabled: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  endpoint: "https://openapi.tuyaus.com"
  access_id: ""
  access_secret: ""
  device_id: ""
schema:
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  endpoint: str
  access_id: str
  access_secret: password
  device_id: str
