<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuya IR Control</title><style>
:root{color-scheme:dark;--bg:#111315;--card:#1c1f22;--card2:#24282c;--line:#343a40;--txt:#e9eef2;--muted:#9aa4ad;--accent:#03a9d9;--good:#5dd28a;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:68px;border-bottom:1px solid #2a2e32;display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;background:#17191b;z-index:3}.logo{font-size:30px}.top h1{font-size:22px;margin:0}.top .sub{margin-left:auto;color:var(--muted)}main{max-width:1280px;margin:auto;padding:28px}.hero{display:flex;align-items:center;gap:16px;margin-bottom:22px}.hero h2{margin:0 0 5px;font-size:26px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:22px 0}.tab{background:transparent;border:0;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:#fff;border-color:var(--accent)}button,.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:650;cursor:pointer}button.ghost{background:#2b3035}button.danger{background:#5b2228;color:#ffb4b4}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--card);border:1px solid #30353a;border-radius:14px;padding:18px}.card h3{margin:0 0 6px;font-size:18px}.card .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.badge{display:inline-flex;border-radius:999px;background:#26343a;color:#7dddf5;padding:5px 9px;font-size:12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectionHead h2{margin:0}.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:14px}.key{background:var(--card2);border:1px solid #373d43;border-radius:12px;padding:14px;text-align:left}.key b{display:block;margin-bottom:6px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:10}.modal.hide{display:none}.dialog{width:min(720px,100%);max-height:88vh;overflow:auto;background:#1b1e21;border:1px solid #3a4046;border-radius:16px;padding:22px;box-shadow:0 20px 80px #0008}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}input,select,textarea{width:100%;background:#101214;border:1px solid #3a4148;border-radius:9px;color:#fff;padding:11px}label{display:block;color:var(--muted);margin:14px 0 6px}.code{font:12px ui-monospace,SFMono-Regular,monospace;background:#101214;border:1px solid #343b42;padding:12px;border-radius:9px;word-break:break-all;max-height:130px;overflow:auto}.status{padding:12px;border-radius:10px;background:#20252a;margin:14px 0}.pulse{display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:50%;margin-right:8px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:600px){main{padding:16px}.top{padding:0 16px}.top .sub{display:none}}
</style></head><body><div class="top"><div class="logo">⌁</div><h1>Tuya IR Control</h1><div class="sub" id="hub">Carregando…</div></div><main><div class="hero"><div><h2>Controles remotos</h2><div class="muted">Catálogo Tuya e controles personalizados ficam separados.</div></div></div><div id="notice"></div><div class="tabs"><button class="tab active" data-tab="configured">Configurados</button><button class="tab" data-tab="custom">Personalizados</button></div><section id="configured"><div class="sectionHead"><h2>Controles configurados</h2><button id="addCatalog">+ Adicionar do catálogo</button></div><div class="grid" id="remoteGrid"></div></section><section id="custom" hidden><div class="sectionHead"><h2>Controles personalizados</h2><button id="addCustom">+ Criar controle</button></div><div class="grid" id="customGrid"></div></section></main><div id="modal" class="modal hide"><div class="dialog" id="dialog"></div></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={remotes:[],controls:[]},poll=null,categories=[];
const TYPES=[
 ['TV','📺',['tv','television']],['Decodificador de TV','📡',['set top','set-top','stb','decoder','cable']],['TV Box','▣',['tv box','box']],['Ar-condicionado','❄️',['air conditioner','air-conditioner','air conditioning','ac']],['Ventilador','🌀',['fan']],['Luz','💡',['light','lamp']],['Áudio','🔊',['audio','speaker','sound']],['Projetor','📽️',['projector']],['DVD','💿',['dvd']],['Câmera','📷',['camera']],['Aquecedor','♨️',['heater']],['Purificador','◌',['purifier']],['DIY','🛠️',[]]
];
async function api(path,opt={}){let r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json();if(!j.ok)throw Error(j.error||'Erro');return j.data}
function post(path,data){return api(path,{method:'POST',body:JSON.stringify(data||{})})}
function notice(t,bad=false){$('#notice').innerHTML=`<div class="status ${bad?'bad':'good'}">${esc(t)}</div>`;setTimeout(()=>$('#notice').innerHTML='',4500)}
function modal(h){$('#dialog').innerHTML=h;$('#modal').classList.remove('hide')}
function closeModal(){if(poll){clearInterval(poll);poll=null}$('#modal').classList.add('hide');$('#dialog').innerHTML=''}
window.closeModal=closeModal;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hide'))closeModal()});
$('.tabs').onclick=e=>{if(!e.target.dataset.tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e.target));['configured','custom'].forEach(x=>$('#'+x).hidden=x!==e.target.dataset.tab)};
async function load(){try{state=await api('api/state');$('#hub').textContent=state.configured?`Hub ${state.device_id} • ${state.remotes.length} controles Tuya`:'Configure o aplicativo';render()}catch(e){notice(e.message,true)}}
function typeIcon(t){return TYPES.find(x=>x[0]===t)?.[1]||'🛠️'}
function render(){if(!state.configured)$('#notice').innerHTML='<div class="status bad">Configure endpoint, Access ID, Access Secret e Device ID na aba Configuração do aplicativo e reinicie.</div>';$('#remoteGrid').innerHTML=state.remotes.map(r=>`<div class="card"><div class="row between"><div><h3>${esc(r.remote_name)}</h3><div class="muted">${esc(r.brand_name||'Tuya')}</div></div><span class="badge">${Number(r.category_id)===5?'Ar-condicionado':'Catálogo'}</span></div><div class="actions"><button onclick='${Number(r.category_id)===5?'openAC':'openRemote'}(${JSON.stringify(r)})'>Abrir</button><button class="ghost" onclick='renameRemote(${JSON.stringify(r)})'>Renomear</button><button class="danger" onclick='deleteRemote(${JSON.stringify(r)})'>Remover</button></div></div>`).join('')||'<div class="muted">Nenhum controle Tuya cadastrado.</div>';$('#customGrid').innerHTML=state.controls.map(c=>`<div class="card"><div class="row between"><div><h3>${typeIcon(c.type)} ${esc(c.name)}</h3><div class="muted">${esc(c.type||'DIY')} • ${c.keys.length} tecla(s)</div></div><span class="badge">Personalizado</span></div><div class="actions"><button onclick="openCustom('${c.id}')">Abrir</button><button class="ghost" onclick="renameCustom('${c.id}')">Renomear</button><button class="danger" onclick="deleteCustom('${c.id}')">Excluir</button></div></div>`).join('')||'<div class="muted">Crie um controle do zero e ensine as teclas usando o receptor IR.</div>'}
async function openRemote(r){modal(`<div class="row between"><div><h2>${esc(r.remote_name)}</h2><div class="muted">${esc(r.brand_name||'Tuya')}</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><div id="keys" class="keys"><div class="muted">Carregando…</div></div>`);try{let ks=await api(`api/remotes/${r.remote_id}/keys`);$('#keys').innerHTML=ks.map(k=>`<button class="key" onclick='sendKey(${JSON.stringify(r)},${JSON.stringify(k)})'><b>${esc(k.key_name||k.key||'Tecla')}</b><span class="muted">Enviar</span></button>`).join('')||'<div class="muted">Nenhuma tecla retornada.</div>'}catch(e){$('#keys').innerHTML=`<div class="bad">${esc(e.message)}</div>`}}
async function sendKey(r,k){try{await post('api/send',{remote_id:r.remote_id,category_id:Number(r.category_id),key_id:k.key_id??k.id??null,key:k.key||k.key_name||'IR'});notice('Comando enviado.')}catch(e){notice(e.message,true)}}
function catList(z){return Array.isArray(z)?z:(z?.list||z?.category_list||[])}
function catIdFor(type){if(type==='Ar-condicionado')return 5;let t=TYPES.find(x=>x[0]===type),aliases=t?.[2]||[];let found=categories.find(c=>{let n=String(c.category_name||c.name||'').toLowerCase();return aliases.some(a=>n.includes(a))});return found?.category_id??found?.id??null}
async function ensureCategories(){if(categories.length)return;try{categories=catList(await api('api/catalog?action=categories'))}catch(e){categories=[]}}
$('#addCustom').onclick=async()=>{await ensureCategories();modal(`<div class="row between"><div><h2>Novo controle personalizado</h2><div class="muted">Crie do zero e aprenda as teclas pelo receptor IR. O tipo é apenas uma referência visual e não consulta o catálogo Tuya.</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><label>Nome do controle</label><input id="cname" placeholder="Ex.: TV do quarto"><label>Tipo de equipamento</label><div class="keys" id="typeGrid">${TYPES.map(t=>`<button class="key typePick" data-type="${esc(t[0])}"><b style="font-size:20px">${t[1]} ${esc(t[0])}</b><span class="muted">Criar e aprender teclas</span></button>`).join('')}</div><div id="diyRef"></div>`);document.querySelectorAll('.typePick').forEach(bt=>bt.onclick=()=>chooseType(bt.dataset.type))}
async function chooseType(type){let name=$('#cname').value.trim();if(!name){$('#cname').focus();return notice('Informe primeiro o nome do controle.',true)}if(type==='Ar-condicionado'){return startCustomAC(name)}if(type==='DIY'){let opts=TYPES.filter(t=>t[0]!=='DIY').map(t=>`<option value="${esc(t[0])}">${t[1]} ${esc(t[0])}</option>`).join('');$('#diyRef').innerHTML=`<div class="status"><b>DIY</b><div class="muted">Qual tipo de equipamento este controle DIY representa?</div><label>Referência</label><select id="refType">${opts}</select><div class="row" style="margin-top:14px"><button id="startDIY">Criar e iniciar aprendizado</button></div></div>`;$('#startDIY').onclick=()=>createAndLearn(name,type,$('#refType').value);return}await createAndLearn(name,type,type)}
async function createAndLearn(name,type,ref){try{let category_id=catIdFor(ref);let c=await post('api/custom',{name,type,reference_type:ref,category_id});await load();document.querySelector('[data-tab=custom]').click();learnKey(c.id,true)}catch(e){notice(e.message,true)}}
function getC(id){return state.controls.find(x=>x.id===id)}
function openCustom(id){let c=getC(id);modal(`<div class="row between"><div><h2>${typeIcon(c.type)} ${esc(c.name)}</h2><div class="muted">${esc(c.type||'DIY')}${c.type==='DIY'&&c.reference_type?' • referência: '+esc(c.reference_type):''} • ${c.keys.length} tecla(s)</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><div class="sectionHead"><h3>${c.protocol==='ac_structured'?'Teclas personalizadas':'Teclas aprendidas'}</h3><button onclick="${c.protocol==='ac_structured'?`addACCustomKey('${id}')`:`learnKey('${id}')`}">+ Adicionar tecla</button></div><div class="keys">${c.keys.map(k=>`<div class="key"><b>${esc(k.name)}</b><div class="row"><button onclick="sendCustom('${id}','${k.id}')">Enviar</button><button class="ghost" onclick="renameKey('${id}','${k.id}')">Renomear</button><button class="danger" onclick="deleteKey('${id}','${k.id}')">Excluir</button></div></div>`).join('')||'<div class="muted">Nenhuma tecla ainda. Clique em Adicionar tecla para configurar o primeiro comando.</div>'}</div>`)}
async function startCustomAC(name){
 modal(`<div class="row between"><div><h2>❄️ ${esc(name)}</h2><div class="muted">AC personalizado usa a biblioteca Tuya para transmitir corretamente, mas você escolhe as teclas que quer exibir.</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><label>Marca</label><select id="pcBrand"><option>Carregando…</option></select><div id="pcIdx"></div>`);
 try{let bs=await api('api/catalog?action=brands&category_id=5');bs=Array.isArray(bs)?bs:(bs?.list||[]);$('#pcBrand').innerHTML='<option value="">Selecione…</option>'+bs.map(x=>`<option value="${x.brand_id??x.id}" data-name="${esc(x.brand_name||x.name||'')}">${esc(x.brand_name||x.name||x.brand_id)}</option>`).join('');$('#pcBrand').onchange=async()=>{let b=$('#pcBrand').value;if(!b)return;let z=await api(`api/catalog?action=indexes&category_id=5&brand_id=${b}`),is=Array.isArray(z)?z:(z?.list||z?.remote_index_list||[]);$('#pcIdx').innerHTML='<h3>Bibliotecas</h3><div class="muted">Teste Power. Quando o aparelho responder, use esse índice para criar o controle personalizado.</div><div class="keys">'+is.map(x=>{let i=x.remote_index??x.index??x;return `<div class="key"><b>Índice ${i}</b><div class="row"><button onclick="testAC(5,${Number(i)},'power',1,this)">Testar Power</button><button class="ghost" onclick="finishCustomAC(${Number(b)},${Number(i)},'${esc(name)}')">Usar este índice</button></div></div>`}).join('')+'</div>'}}catch(e){notice(e.message,true)}}
async function finishCustomAC(bid,idx,name){let o=$('#pcBrand').selectedOptions[0],brand=o?.dataset?.name||'';try{let c=await post('api/custom/ac/setup',{name,brand_id:bid,brand_name:brand,remote_index:idx});closeModal();await load();document.querySelector('[data-tab=custom]').click();openCustom(c.id)}catch(e){notice(e.message,true)}}
function addACCustomKey(cid){let c=getC(cid);modal(`<div class="row between"><div><h2>Adicionar tecla</h2><div class="muted">${esc(c.name)} • comando AC estruturado</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><label>Nome da tecla</label><input id="ackName" placeholder="Ex.: 23 °C"><label>Comando</label><select id="ackCode"><option value="power">Power</option><option value="temp">Temperatura</option><option value="mode">Modo</option><option value="wind">Ventilação</option></select><label>Valor</label><input id="ackValue" placeholder="Ex.: 1, 23, 0"><div class="muted">Power: 1 ligar / 0 desligar. Temperatura: ex. 23. Mode e Wind usam os valores suportados pela biblioteca selecionada.</div><div class="row" style="margin-top:14px"><button id="ackTest">Testar</button><button id="ackSave">Salvar tecla</button></div>`);$('#ackTest').onclick=async()=>{let code=$('#ackCode').value,value=Number($('#ackValue').value);try{await post(`api/ac/${c.remote_id}/command`,{code,value});notice('Comando enviado.')}catch(e){notice(e.message,true)}};$('#ackSave').onclick=async()=>{let name=$('#ackName').value.trim(),code=$('#ackCode').value,value=Number($('#ackValue').value);if(!name)return notice('Informe o nome da tecla.',true);try{await post(`api/custom/${cid}/ac-keys`,{name,code,value});closeModal();await load();openCustom(cid)}catch(e){notice(e.message,true)}}}
async function learnKey(cid,first=false){let c=getC(cid);modal(`<div class="row between"><div><h2>${first?'Primeira tecla':'Adicionar tecla'}</h2><div class="muted">${esc(c.name)} • ${esc(c.type||'DIY')}</div></div><button class="ghost" onclick="stopLearn()">Fechar</button></div><label>Nome da tecla</label><input id="kname" placeholder="Ex.: Power"><div class="status" id="learnStatus"><span class="pulse"></span>Preparando receptor…</div><div id="captured"></div>`);try{let z=await post('api/learning/start');let lt=z.learning_time;$('#learnStatus').innerHTML='<span class="pulse"></span><b>Aguardando sinal IR…</b><div class="muted">Aponte o controle físico para o receptor e pressione a tecla uma vez.</div>';let busy=false;poll=setInterval(async()=>{if(busy)return;busy=true;try{let x=await api(`api/learning/read?learning_time=${lt}`);if(x.code){clearInterval(poll);poll=null;await post('api/learning/stop');showCaptured(cid,x.code)}}catch(e){}finally{busy=false}},1000)}catch(e){$('#learnStatus').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
function showCaptured(cid,code){$('#learnStatus').innerHTML='<span class="good">✓ Sinal capturado automaticamente.</span>';$('#captured').innerHTML=`<label>Código capturado</label><div class="code">${esc(code)}</div><div class="row" style="margin-top:14px"><button id="testRaw">Testar sinal</button><button class="ghost" id="again">Capturar novamente</button><button id="saveKey">Salvar tecla</button></div><div class="muted" style="margin-top:10px">No primeiro teste deste controle, o App cria o controle DIY correspondente na nuvem Tuya para permitir a retransmissão.</div>`;$('#testRaw').onclick=async()=>{let name=$('#kname').value.trim()||'Teste';try{await post(`api/custom/${cid}/test`,{name,code});$('#learnStatus').innerHTML='<span class="good">✓ Sinal transmitido. Confirme se o equipamento respondeu.</span>';await load()}catch(e){$('#learnStatus').innerHTML=`<span class="bad">${esc(e.message)}</span>`}};$('#again').onclick=()=>learnKey(cid);$('#saveKey').onclick=async()=>{let name=$('#kname').value.trim();if(!name)return $('#learnStatus').innerHTML='<span class="bad">Informe um nome para a tecla.</span>';try{await post(`api/custom/${cid}/keys`,{name,code});closeModal();await load();openCustom(cid)}catch(e){$('#learnStatus').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}}
async function stopLearn(){if(poll){clearInterval(poll);poll=null}try{await post('api/learning/stop')}catch(e){}closeModal()}
async function sendCustom(cid,kid){try{await post(`api/custom/${cid}/keys/${kid}`,{action:'send'});notice('Sinal enviado.')}catch(e){notice(e.message,true)}}
async function renameCustom(id){let c=getC(id),n=prompt('Novo nome:',c.name);if(!n)return;await post(`api/custom/${id}/rename`,{name:n});await load()}
async function deleteCustom(id){if(!confirm('Excluir este controle personalizado também da nuvem Tuya?'))return;await api(`api/custom/${id}`,{method:'DELETE'});await load()}
async function renameKey(cid,kid){let c=getC(cid),k=c.keys.find(x=>x.id===kid),n=prompt('Novo nome:',k.name);if(!n)return;await post(`api/custom/${cid}/keys/${kid}`,{action:'rename',name:n});closeModal();await load();openCustom(cid)}
async function deleteKey(cid,kid){if(!confirm('Excluir esta tecla?'))return;await post(`api/custom/${cid}/keys/${kid}`,{action:'delete'});closeModal();await load();openCustom(cid)}
async function renameRemote(r){let n=prompt('Novo nome:',r.remote_name);if(!n)return;await post(`api/remotes/${r.remote_id}`,{action:'rename',name:n});await load()}
async function deleteRemote(r){if(!confirm(`Remover apenas o controle \"${r.remote_name}\"?`))return;try{await post(`api/remotes/${r.remote_id}`,{action:'delete'});await load();notice('Controle removido.')}catch(e){notice(e.message,true)}}
$('#addCatalog').onclick=async()=>{modal(`<div class="row between"><div><h2>Adicionar controle Tuya</h2><div class="muted">Escolha o tipo de configuração.</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><div class="keys" style="margin-top:18px"><button class="key" onclick="closeModal();openACWizard()"><b>❄️ Ar-condicionado</b><span class="muted">Marca → índices → testar → adicionar</span></button><button class="key" id="normalCatalog"><b>⌁ Outros equipamentos</b><span class="muted">Catálogo Tuya padrão</span></button></div>`);$('#normalCatalog').onclick=openNormalCatalog}
async function openNormalCatalog(){modal(`<div class="row between"><h2>Adicionar controle Tuya</h2><button class="ghost" onclick="closeModal()">Fechar</button></div><label>Categoria</label><select id="cat"><option>Carregando…</option></select><label>Marca</label><select id="brand"><option>Selecione a categoria</option></select><div id="idx" class="keys"></div>`);try{let z=await api('api/catalog?action=categories'),xs=catList(z);$('#cat').innerHTML='<option value="">Selecione…</option>'+xs.map(x=>`<option value="${x.category_id??x.id}">${esc(x.category_name||x.name||x.category_id)}</option>`).join('');$('#cat').onchange=async()=>{let c=$('#cat').value,z=await api(`api/catalog?action=brands&category_id=${c}`),bs=Array.isArray(z)?z:(z?.list||[]);$('#brand').innerHTML='<option value="">Selecione…</option>'+bs.map(x=>`<option value="${x.brand_id??x.id}">${esc(x.brand_name||x.name||x.brand_id)}</option>`).join('');$('#brand').onchange=async()=>{let b=$('#brand').value,z=await api(`api/catalog?action=indexes&category_id=${c}&brand_id=${b}`),is=Array.isArray(z)?z:(z?.list||z?.remote_index_list||[]);$('#idx').innerHTML=is.map(x=>{let i=x.remote_index??x.index??x;return `<button class="key" onclick="addIndex(${Number(c)},${Number(b)},${Number(i)})"><b>Índice ${i}</b><span class="muted">Adicionar</span></button>`}).join('')}}}catch(e){notice(e.message,true)}}
async function addIndex(c,b,i){let n=prompt('Nome do controle:','Novo controle');if(!n)return;await post('api/remotes',{category_id:c,brand_id:b,remote_index:i,remote_name:n});closeModal();await load()}

async function openACWizard(prefill=''){
 await ensureCategories();let cid=catIdFor('Ar-condicionado');
 if(!cid)return notice('Não foi possível determinar a categoria do ar-condicionado (Tuya IR category_id 5).',true);
 modal(`<div class="row between"><div><h2>❄️ Adicionar ar-condicionado</h2><div class="muted">Use a biblioteca de códigos da Tuya. O aprendizado bruto não é usado nesta etapa.</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><label>Nome do controle</label><input id="acName" value="${esc(prefill)}" placeholder="Ex.: Ar do quarto"><label>Marca</label><select id="acBrand"><option>Carregando marcas…</option></select><div id="acIndexes"></div>`);
 try{let z=await api(`api/catalog?action=brands&category_id=${cid}`),bs=Array.isArray(z)?z:(z?.list||[]);$('#acBrand').innerHTML='<option value="">Selecione…</option>'+bs.map(x=>`<option value="${x.brand_id??x.id}" data-name="${esc(x.brand_name||x.name||'')}">${esc(x.brand_name||x.name||x.brand_id)}</option>`).join('');$('#acBrand').onchange=()=>loadACIndexes(cid)}catch(e){notice(e.message,true)}
}
async function loadACIndexes(cid){let b=$('#acBrand').value;if(!b)return;$('#acIndexes').innerHTML='<div class="status"><span class="pulse"></span>Carregando bibliotecas compatíveis…</div>';try{let z=await api(`api/catalog?action=indexes&category_id=${cid}&brand_id=${b}`),is=Array.isArray(z)?z:(z?.list||z?.remote_index_list||[]);$('#acIndexes').innerHTML=`<div class="status"><b>${is.length} biblioteca(s) encontrada(s)</b><div class="muted">Teste Power em cada índice. Quando responder, valide também temperatura antes de adicionar.</div></div><div class="keys">${is.map(x=>{let i=x.remote_index??x.index??x;return `<div class="key"><b>Índice ${i}</b><div class="row"><button onclick="testAC(${Number(cid)},${Number(i)},'power',1,this)">Testar Power</button><button class="ghost" onclick="verifyAC(${Number(cid)},${Number(i)})">Validar</button></div></div>`}).join('')}</div>`}catch(e){$('#acIndexes').innerHTML=`<div class="bad">${esc(e.message)}</div>`}}
async function testAC(cid,idx,code,value,bt){try{if(bt){bt.disabled=true;bt.textContent='Enviando…'}await post('api/ac/test',{category_id:cid,remote_index:idx,code,value});notice(`Comando ${code} enviado pelo índice ${idx}.`)}catch(e){notice(e.message,true)}finally{if(bt){bt.disabled=false;bt.textContent='Testar Power'}}}
function verifyAC(cid,idx){let brand=$('#acBrand').value,brandName=$('#acBrand').selectedOptions[0]?.dataset.name||'',name=$('#acName').value.trim()||`Ar ${brandName}`;modal(`<div class="row between"><div><h2>Validar índice ${idx}</h2><div class="muted">${esc(brandName)} • confirme mais de uma função antes de salvar.</div></div><button class="ghost" onclick="openACWizard('${esc(name)}')">Voltar</button></div><div class="status">O Power respondeu corretamente? Agora teste uma temperatura e, se possível, modo ou ventilação.</div><div class="keys"><button class="key" onclick="testAC(${cid},${idx},'power',1)"><b>Power ON</b></button><button class="key" onclick="testAC(${cid},${idx},'temp',22)"><b>22 °C</b></button><button class="key" onclick="testAC(${cid},${idx},'temp',24)"><b>24 °C</b></button><button class="key" onclick="testAC(${cid},${idx},'mode',0)"><b>Modo Frio</b></button><button class="key" onclick="testAC(${cid},${idx},'wind',1)"><b>Fan Baixo</b></button></div><div class="row" style="margin-top:20px"><button onclick="bindAC(${cid},${Number(brand)},${idx},'${esc(brandName)}','${esc(name)}')">✓ Este índice funciona — adicionar controle</button></div>`)}
async function bindAC(cid,bid,idx,brandName,name){try{await post('api/remotes',{category_id:cid,brand_id:bid,brand_name:brandName,remote_index:idx,remote_name:name});closeModal();await load();notice('Ar-condicionado adicionado pelo catálogo Tuya.')}catch(e){notice(e.message,true)}}
function openAC(r){modal(`<div class="row between"><div><h2>❄️ ${esc(r.remote_name)}</h2><div class="muted">${esc(r.brand_name||'Ar-condicionado')} • controle estruturado Tuya</div></div><button class="ghost" onclick="closeModal()">Fechar</button></div><div class="keys"><button class="key" onclick="acCmd('${r.remote_id}','power',1)"><b>Ligar</b></button><button class="key" onclick="acCmd('${r.remote_id}','power',0)"><b>Desligar</b></button><button class="key" onclick="acCmd('${r.remote_id}','temp',22)"><b>22 °C</b></button><button class="key" onclick="acCmd('${r.remote_id}','temp',23)"><b>23 °C</b></button><button class="key" onclick="acCmd('${r.remote_id}','temp',24)"><b>24 °C</b></button><button class="key" onclick="acCmd('${r.remote_id}','mode',0)"><b>Frio</b></button><button class="key" onclick="acCmd('${r.remote_id}','mode',1)"><b>Quente</b></button><button class="key" onclick="acCmd('${r.remote_id}','mode',4)"><b>Seco</b></button><button class="key" onclick="acCmd('${r.remote_id}','wind',0)"><b>Fan Auto</b></button><button class="key" onclick="acCmd('${r.remote_id}','wind',1)"><b>Fan Baixo</b></button><button class="key" onclick="acCmd('${r.remote_id}','wind',2)"><b>Fan Médio</b></button><button class="key" onclick="acCmd('${r.remote_id}','wind',3)"><b>Fan Alto</b></button></div>`)}
async function acCmd(rid,code,value){try{await post(`api/ac/${rid}/command`,{code,value});notice('Comando do ar-condicionado enviado.')}catch(e){notice(e.message,true)}}

load();
</script></body></html>
